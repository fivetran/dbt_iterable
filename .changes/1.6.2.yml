version: 1.6.2
pr_number: 90
under_the_hood:
- description: Moves the `view` materialization for `stg_iterable__event`, `stg_iterable__event_extension`, and `stg_iterable__user_history` from the model files to `dbt_project.yml`. The models still build as views, and you can override their materialization from your root `dbt_project.yml`, for example to tables on destinations that don't support views.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10, which the new v1.11.0 minimum supports.
date: '2026-10-29'
