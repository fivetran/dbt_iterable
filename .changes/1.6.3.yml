version: 1.6.3
pr_number: 93
bug_fixes:
- description: Replaces `fivetran_utils.string_agg` with dbt's built-in `dbt.listagg`. On Databricks,
    aggregated values that contain a comma followed by a space are no longer split apart. Output on
    other warehouses doesn't change.
under_the_hood:
- description: Replaces the package's `iterable_lookback` macro with `fivetran_utils.lookback`, which uses the
    same logic. Calls pass `safety_date='2020-01-01'` to keep the previous default. Output doesn't
    change.
